services:
  app:
    build: .
    container_name: ST-Chat-Explorer
    ports:
      - "10008:8000"
    volumes:
      # Your SillyTavern characters/ and chats/ folders, mounted read-only.
      - ./characters:/data/characters:ro
      - ./chats:/data/chats:ro
    environment:
      DATA_ROOT: /data
    restart: unless-stopped
